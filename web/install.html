<script>
/* 安装向导：POST /api/install → 成功后提示重启（或自动 reload 试探） */
(function () {
  'use strict';
  var msg = document.getElementById('msg');
  var btn = document.getElementById('btnInstall');

  document.getElementById('installForm').addEventListener('submit', function (e) {
    e.preventDefault();
    btn.disabled = true; btn.textContent = '建库建表中…'; msg.className = 'auth-msg'; msg.textContent = '';

    fetch('api/install', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        host: document.getElementById('host').value.trim(),
        port: document.getElementById('port').value.trim(),
        user: document.getElementById('dbuser').value.trim(),
        pass: document.getElementById('dbpass').value,
        db:   document.getElementById('dbname').value.trim(),
        admin: document.getElementById('admin').value.trim(),
        password: document.getElementById('apass').value,
        site_name: document.getElementById('sitename').value.trim(),
        site_tagline: document.getElementById('tagline').value.trim(),
        site_desc: document.getElementById('sitedesc').value.trim(),
        site_author: document.getElementById('author').value.trim()
      })
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, j: j }; });
    }).then(function (res) {
      if (!res.ok) { msg.textContent = res.j.error || '安装失败'; return; }
      msg.className = 'auth-msg ok';
      msg.textContent = '安装完成！正在跳转到登录页…';
      setTimeout(function () { location.href = 'login'; }, 1200);
    }).catch(function (err) {
      msg.textContent = '请求失败：' + err.message;
    }).finally(function () {
      btn.disabled = false; btn.textContent = '安 装';
    });
  });

  /* 已安装的用户误入此页：给个提示而不是白屏表单 */
  fetch('api/posts').then(function (r) {
    if (r.ok) {
      msg.className = 'auth-msg ok';
      msg.textContent = '本站已安装完毕。若要重装，请删除 config.json 后重启程序。';
      btn.disabled = true;
    }
  }).catch(function () {});
})();
</script>
</body>
